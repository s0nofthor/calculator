<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <ul id = "memory">
    </ul>
    <div id = "container">
        <div id = "display">
            <div id = 'equation'>
                <div id = 'x'></div>
                <div id = 'op'></div>
                <div id = 'y'></div>
            </div>
            <div id = 'is'></div>
        </div>
        <div id = "transformers">
            <button id = "all-clear">AC</button>
            <button id = "clear-entry">CE</button>
            <button id = "backspace">DEL</button>
            <button id = "equals">=</button>
        </div>
        <div id = 'inputs'>
            <div id = "number-inputs">
                <button class = 'num' id = 'one'>1</button>
                <button class = 'num' id = 'two'>2</button>
                <button class = 'num' id = 'three'>3</button>
                <button class = 'num' id = 'four'>4</button>
                <button class = 'num' id = 'five'>5</button>
                <button class = 'num' id = 'six'>6</button>
                <button class = 'num' id = 'seven'>7</button>
                <button class = 'num' id = 'eight'>8</button>
                <button class = 'num' id = 'nine'>9</button>
                <button class = 'num' id = 'zero'>0</button>
                <button class = 'num' id = '.'>.</button>
                <button id = 'neg'>(-)</button>
            </div>
            <div id = "in-betweens">
                <button class = 'op' id = "add">+</button>
                <button class = 'op' id = "subtract">-</button>
                <button class = 'op' id = "multiply">*</button>
                <button class = 'op' id = "divide">/</button>
            </div>
        </div>
    </div>
    <script src="processes.js"></script>
</body>
</html>
