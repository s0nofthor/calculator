<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id = "container">
        <div id = "display">
            <div id = 'x'></div>
            <div id = 'op'></div>
            <div id = 'y'></div>
        </div>
        <div id = "number-inputs">
            <button class = 'num'>1</button>
            <button class = 'num'>2</button>
            <button class = 'num'>3</button>
            <button class = 'num'>4</button>
            <button class = 'num'>5</button>
            <button class = 'num'>6</button>
            <button class = 'num'>7</button>
            <button class = 'num'>8</button>
            <button class = 'num'>9</button>
            <button class = 'num'>0</button>
            <button class = 'num'>.</button>
            <button id = 'neg'>(-)</button>
        </div>
        <div id = "in-betweens">
            <button class = 'op' id = "add">+</button>
            <button class = 'op' id = "subtract">-</button>
            <button class = 'op' id = "multiply">*</button>
            <button class = 'op' id = "divide">/</button>
        </div>
        <div id = "transformers">
            <button id = "equals">=</button>
            <button id = "clear-entry">CE</button>
            <button id = "all-clear">AC</button>
        </div>
    </div>
    <script src="processes.js"></script>
</body>
</html>
