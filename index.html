<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id = "container">
        <div id = "display">83475</div>
        <div id = "number-inputs">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>0</button>
            <button>.</button>
            <button>(-)</button>
        </div>
        <div id = "in-betweens">
            <button id = "add">+</button>
            <button id = "subtract">-</button>
            <button id = "multiply">*</button>
            <button id = "divide">/</button>
            <button id = "equals">=</button>
        </div>
        <div id = "erasers">
            <button>CE</button>
            <button>AC</button>
        </div>
    </div>
    <script src="processes.js"></script>

</html>
